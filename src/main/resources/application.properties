spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.application.name=nail-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# OCI configuration
spring.cloud.oci.config.type=${TYPE}
spring.cloud.oci.config.file=${OCI_CONFIG_FILE}
spring.cloud.oci.config.profile=DEFAULT
spring.cloud.oci.region.static=${REGIAO}
spring.cloud.oci.compartment.static=${COMPARTMENT_OCID}

# OCI Object Storage bucket
oci.bucket.name=${BUCKET_NAME}
oci.bucket.namespace=${BUCKET_TENANCY}

# Multipart request limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
